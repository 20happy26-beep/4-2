<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4572e">
<title>반응속도 · 스톱워치 게임</title>
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --fg:#1d1d21; --muted:#6c6c75; --line:#e4e1da;
  --accent:#e4572e; --accent-fg:#ffffff; --ok:#2f9e5b; --stop:#c8372d;
  --gold:#d4a017; --silver:#9aa3ad; --bronze:#b87333;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131316; --card:#1d1d22; --fg:#ececf0; --muted:#9a9aa4; --line:#2d2d34;
    --accent:#ff7a52; --accent-fg:#131316; --ok:#4cc27c; --stop:#ff6b5e;
    --gold:#e8b630; --silver:#b4bcc6; --bronze:#d08a4e;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:24px; padding-bottom:110px;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
[hidden]{display:none!important}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{
  flex:1 1 140px; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
  background:transparent; color:var(--fg); font:inherit; font-weight:600; cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{margin:10px 0 0;color:var(--muted);font-size:13.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.field label{font-size:13.5px;color:var(--muted);font-weight:600}
.field input{
  padding:12px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg); color:var(--fg); font:inherit; min-width:0; width:100%;
}
.name-show{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:46px;font-weight:600;color:var(--muted)}
.name-show.on{color:var(--fg)}
.btn{
  padding:12px 16px; border-radius:10px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); font:inherit; font-weight:600; cursor:pointer;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--stop)}
.err{color:var(--stop);font-size:13.5px;min-height:20px;margin:8px 0 0}
.who-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.who-bar .me{font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center;justify-content:flex-end}
.lg-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lg-mine{font-weight:700;margin:12px 0 0}

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex;
  background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
}
.nav-btn{
  flex:1; padding:14px 8px; border:0; background:transparent; color:var(--muted);
  font:inherit; font-weight:700; cursor:pointer;
}
.nav-btn[aria-selected="true"]{color:var(--accent)}

.play{
  margin-top:16px; min-height:260px; border-radius:12px; border:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:20px; gap:10px; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation; transition:background .15s;
}
.play .big{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.play .hint{color:var(--muted);font-size:14px}
.play.wait{background:var(--stop);border-color:var(--stop);color:#fff}
.play.wait .hint{color:#fff;opacity:.9}
.play.go{background:var(--ok);border-color:var(--ok);color:#fff}
.play.go .hint{color:#fff;opacity:.9}
.saved{font-size:13.5px;margin-top:10px;min-height:20px}
.saved.ok{color:var(--ok)}
.saved.bad{color:var(--stop)}

.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin-top:16px;margin-bottom:16px}
.step{
  border-radius:12px 12px 4px 4px; padding:12px 8px; text-align:center; min-width:0;
  display:flex; flex-direction:column; justify-content:flex-end; gap:2px;
  background:var(--bg); border:1px solid var(--line);
}
.step .medal{font-size:13px;font-weight:700;letter-spacing:.02em}
.step .pname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .pno{color:var(--muted);font-size:12.5px}
.step .pscore{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;margin-top:4px}
.step.first{padding-top:20px;min-height:200px;border-color:var(--gold)}
.step.second{min-height:160px;border-color:var(--silver)}
.step.third{min-height:130px;border-color:var(--bronze)}
.step.first .medal{color:var(--gold)}
.step.second .medal{color:var(--silver)}
.step.third .medal{color:var(--bronze)}
.step.empty-step{opacity:.4}

.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{
  display:grid; grid-template-columns:44px minmax(0,1fr) auto; align-items:center; gap:10px;
  padding:10px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--line);
}
.rank{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.who small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.score{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:12px 0;margin:0}
.tt-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.tt-row.locked{opacity:.55}
.tt-cond{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>반응속도 · 스톱워치 게임</h1>
    <p class="sub">내 번호를 입력하고 들어가서 우리 반 최고 기록에 도전해 보세요.</p>
  </header>

  <!-- 번호 입력 -->
  <section class="card" id="entry" hidden aria-label="번호 입력">
    <form id="form-entry">
      <div class="field">
        <label for="n-no">번호</label>
        <input id="n-no" type="number" inputmode="numeric" min="0" max="27" placeholder="번호 입력 (0~27)">
      </div>
      <div class="field">
        <label>이름</label>
        <div id="n-name" class="name-show">번호를 입력하면 이름이 나와요</div>
      </div>
      <p class="err" id="n-err"></p>
      <div class="row"><button class="btn primary" id="n-go" type="submit">들어가기</button></div>
    </form>
  </section>

  <!-- main -->
  <div id="main" hidden style="display:flex;flex-direction:column;gap:20px">

    <section class="card" aria-label="내 정보">
      <div class="who-bar">
        <span class="me" id="me"></span>
        <button class="btn" id="change-no">번호 바꾸기</button>
      </div>
    </section>

    <section class="card" aria-label="칭호">
      <h2>칭호</h2>
      <p class="rule" id="title-now"></p>
      <div id="title-list" style="margin-top:12px;display:flex;flex-direction:column;gap:6px"></div>
      <div class="row"><button class="btn" id="title-off">칭호 해제</button></div>
      <p class="saved" id="title-msg"></p>
    </section>

    <!-- HOME -->
    <div id="panel-home" style="display:flex;flex-direction:column;gap:20px">
      <div id="home-slot">
        <section class="card" id="play-card" aria-label="게임">
          <div class="tabs" role="tablist" style="margin-top:0">
            <button class="tab" role="tab" aria-selected="true" data-mode="react">반응속도</button>
            <button class="tab" role="tab" aria-selected="false" data-mode="stop">스톱워치 맞추기</button>
          </div>
          <p class="rule" id="rule"></p>
          <div class="play" id="play" role="button" tabindex="0" aria-live="polite">
            <div class="big" id="big">준비</div>
            <div class="hint" id="hint">눌러서 시작</div>
          </div>
          <div class="row"><button class="btn primary" id="save" disabled>기록 저장</button></div>
          <p class="saved" id="saved"></p>
        </section>
      </div>

      <section class="card" aria-label="전체 순위">
        <h2>전체 순위</h2>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" aria-selected="true" data-lb="react">반응속도</button>
          <button class="tab" role="tab" aria-selected="false" data-lb="stop">스톱워치</button>
        </div>
        <div class="podium" id="podium"></div>
        <p class="empty" id="empty" hidden></p>
        <ol class="board" id="board" start="4"></ol>
      </section>
    </div>

    <!-- LEAGUE -->
    <div id="panel-league" hidden style="display:flex;flex-direction:column;gap:20px">
      <div id="league-slot"></div>

      <section class="card" aria-label="이번 주 리그">
        <div class="lg-head">
          <h2 id="lg-sport">리그</h2>
          <span class="rule" style="margin:0" id="lg-cur-range"></span>
        </div>
        <p class="lg-mine" id="lg-mine"></p>
        <p class="rule">리그 기록은 이번 주 가장 좋은 기록으로 순위를 매깁니다. 주간 리그는 매주 월요일에 시작해 일요일에 끝나요.</p>
      </section>

      <section class="card" aria-label="다음 주 리그 신청">
        <h2>다음 주 리그 신청</h2>
        <p class="rule" id="lg-next-range"></p>
        <div class="lg-head" style="margin-top:12px">
          <span class="rule" style="margin:0" id="lg-next-count"></span>
          <span style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn primary" id="lg-signup">다음 주 리그 신청</button>
            <button class="btn danger" id="lg-cancel" hidden>신청 취소</button>
          </span>
        </div>
        <p class="saved" id="lg-msg"></p>
      </section>

      <section class="card" aria-label="이번 주 순위">
        <h2>이번 주 순위</h2>
        <ol class="board" id="lg-rank"></ol>
        <p class="empty" id="lg-empty" hidden></p>
      </section>

      <section class="card" aria-label="지난 주 우승">
        <h2>지난 주 우승</h2>
        <ol class="board" id="lg-hist"></ol>
      </section>
    </div>
  </div>

</div>

<nav class="bottom-nav" id="bottom-nav" hidden>
  <button class="nav-btn" data-panel="home" aria-selected="true">홈</button>
  <button class="nav-btn" data-panel="league" aria-selected="false">리그</button>
</nav>

  }
  function setSavedNo(n){
    try { if (n === null) localStorage.removeItem('myNo'); else localStorage.setItem('myNo', String(n)); } catch(e){}
  }

  function recordTitles(m, score, elapsed){
    var ids = [];
    TITLES.forEach(function(t){
      if (t.kind === 'react' && m === 'react' && score < t.lt) ids.push(t.id);
      if (t.kind === 'stop' && m === 'stop' && elapsed != null && t.at.indexOf(elapsed) >= 0) ids.push(t.id);
    });
    return ids;
  }
  function grantIds(ids){
    if (!ids.length) return Promise.resolve();
    return db.rpc('grant_titles', { p_no: me.no, p_ids: ids }).then(function(r){ if (r.error) throw r.error; });
  }

  // 목록의 각 사람에게 장착 칭호를 붙이기
  function attachTitles(rows){
    var nos = [];
    rows.forEach(function(r){ if (nos.indexOf(r.no) < 0) nos.push(r.no); });
    if (!nos.length) return Promise.resolve(rows);
    return db.from('players').select('no,equipped').in('no', nos).then(function(r){
      if (r.error) throw r.error;
      var map = {};
      (r.data || []).forEach(function(p){ map[p.no] = p.equipped; });
      rows.forEach(function(x){ x.title = labelOf(map[x.no]); });
      return rows;
    });
  }

  /* ---------- game engine ---------- */
  function resetGame(){
    clearTimeout(rtTimer);
    pending = null; phase = 'idle'; swPhase = 'idle';
    play.className = 'play';
    saveBtn.disabled = true; savedMsg.textContent = ''; savedMsg.className = 'saved';
    big.style.opacity = '1';
    if (mode === 'react'){
      big.textContent = '준비'; hint.textContent = '눌러서 시작';
    } else {
      big.textContent = '10.000'; hint.textContent = '눌러서 시작';
      big.style.opacity = '.35';
    }
  }
  function rtPlay(){
    if (phase === 'idle' || phase === 'done'){
      phase = 'wait';
      play.className = 'play wait';
      big.textContent = '기다리세요';
      hint.textContent = '초록색이 되면 누르세요';
      saveBtn.disabled = true; savedMsg.textContent = '';
      rtTimer = setTimeout(function(){
        phase = 'go';
        rtGoAt = performance.now();
        play.className = 'play go';
        big.textContent = '지금!';
        hint.textContent = '누르세요';
      }, 1500 + Math.random() * 3000);
    } else if (phase === 'wait'){
      clearTimeout(rtTimer);
      phase = 'idle';
      play.className = 'play';
      big.textContent = '너무 빨라요';
      hint.textContent = '초록색이 될 때까지 기다렸다가 누르세요. 눌러서 다시 시작';
    } else if (phase === 'go'){
      var ms = Math.round(performance.now() - rtGoAt);
      phase = 'done';
      play.className = 'play';
      big.textContent = ms + ' ms';
      hint.textContent = '다시 하려면 누르세요';
      pending = { score: ms };
      saveBtn.disabled = false;
    }
  }
  function swPlay(){
    if (swPhase === 'idle' || swPhase === 'done'){
      swPhase = 'running';
      swStart = performance.now();
      play.className = 'play';
      big.style.opacity = '1';
      big.textContent = '??.???';
      hint.textContent = '10초라고 생각되면 누르세요';
      saveBtn.disabled = true; savedMsg.textContent = '';
    } else if (swPhase === 'running'){
      var elapsed = performance.now() - swStart;
      var diff = Math.round(Math.abs(elapsed - 10000));
      swPhase = 'done';
      big.textContent = (elapsed / 1000).toFixed(3) + ' 초';
      hint.textContent = (elapsed > 10000 ? '+' : '-') + diff + ' ms 차이 · 다시 하려면 누르세요';
      pending = { score: diff, elapsed: Math.round(elapsed) };
      saveBtn.disabled = false;
    }
  }
  function onPlay(){ if (mode === 'react') rtPlay(); else swPlay(); }
  play.addEventListener('click', onPlay);
  play.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onPlay(); }
  });

  /* ---------- all-time board ---------- */
  function loadBoard(){

    db.from('scores').select('no,name,score,created_at')
      .eq('mode', m).order('score', { ascending: true }).order('created_at', { ascending: true }).limit(10)
      .then(function(r){

  /* ---------- league ---------- */
  function loadLeague(){
    var weeks = [];
    for (var k = -4; k <= 1; k++) weeks.push(weekKey(weekMonday(k)));
    return db.from('league_entries').select('week,mode,no,name,best,tries,at').in('week', weeks)
      .then(function(r){
        if (r.error) throw r.error;
        return attachTitles(r.data || []);
      }).then(function(entries){
        league = { cur: weekKey(weekMonday(0)), next: weekKey(weekMonday(1)), entries: entries };
        if (panel === 'league') renderLeague();
      }).catch(function(){
        $('#lg-msg').className = 'saved bad';
        $('#lg-msg').textContent = '리그 정보를 불러오지 못했어요.';
      });
  }

  function rankedOf(week, m){
    var list = league.entries.filter(function(r){ return r.week === week && r.mode === m; });
    var played = list.filter(function(r){ return Number(r.best) < NONE; })
      .sort(function(a, b){ return (Number(a.best) - Number(b.best)) || (Number(a.at) - Number(b.at)); });
    var rest = list.filter(function(r){ return !(Number(r.best) < NONE); });
    return { played: played, rest: rest, total: list.length };
  }

  function renderLeague(){
    if (!league) return;
    var m = mode, cur = league.cur, next = league.next;
    $('#lg-sport').textContent = m === 'react' ? '반응속도 리그' : '스톱워치 리그';
    $('#lg-cur-range').textContent = weekRange(weekMonday(0)) + ' · 진행 중';

    $('#lg-msg').className = 'saved';

    var curRank = rankedOf(cur, m);
    var nextRank = rankedOf(next, m);
    var mineCur = curRank.played.concat(curRank.rest).filter(function(r){ return r.no === me.no; })[0];
    var mineNext = nextRank.played.concat(nextRank.rest).filter(function(r){ return r.no === me.no; })[0];

    var text;
    if (!mineCur) text = '이번 주 리그에는 신청하지 않았어요.';
    else if (Number(mineCur.best) < NONE) text = '이번 주 내 최고 기록 ' + fmt(m, mineCur.best) + ' · ' + (curRank.played.indexOf(mineCur) + 1) + '위';
    else text = '이번 주 리그 신청 완료. 아직 기록이 없어요.';

    $('#lg-signup').hidden = !!mineNext;

    $('#lg-cancel').hidden = !mineNext;
    $('#lg-cancel').disabled = false;
    $('#lg-next-count').textContent = '다음 주 신청자 ' + nextRank.total + '명';

    var rankOl = $('#lg-rank'), rankEmpty = $('#lg-empty');
    rankOl.innerHTML = '';
    var all = curRank.played.concat(curRank.rest);
    rankEmpty.hidden = all.length > 0;
    rankEmpty.textContent = '이번 주 리그 신청자가 아직 없어요.';
    all.forEach(function(r, i){
      var played = Number(r.best) < NONE;

      var small = document.createElement('small'); small.textContent = r.no + '번';
      who.appendChild(small);
      var sc = document.createElement('span'); sc.className = 'score';
      sc.textContent = played ? fmt(m, r.best) : '기록 없음';

    });

    var histOl = $('#lg-hist');
    histOl.innerHTML = '';
    for (var k = 1; k <= 4; k++){
      var mon = weekMonday(-k);
      var past = rankedOf(weekKey(mon), m);
      var li2 = document.createElement('li');
      var lab = document.createElement('span'); lab.className = 'rank';
      lab.textContent = k === 1 ? '지난 주' : k + '주 전';
      var who2 = document.createElement('div'); who2.className = 'who';
      var small2 = document.createElement('small'); small2.textContent = weekRange(mon);
      li2.appendChild(lab);
      if (past.played.length){
        var w = past.played[0];
        who2.textContent = honorRow(w);
        small2.textContent = weekRange(mon) + ' · ' + w.no + '번';
        who2.appendChild(small2);
        var sc2 = document.createElement('span'); sc2.className = 'score'; sc2.textContent = fmt(m, w.best);
        li2.appendChild(who2); li2.appendChild(sc2);
      } else {
        who2.textContent = '우승자 없음';
        who2.appendChild(small2);
        li2.appendChild(who2);
      }
      histOl.appendChild(li2);

  /* ---------- league titles ---------- */
  function longestRun(weeks){
    var best = 0, run = 0, prev = null;
    weeks.forEach(function(w){
      var t = new Date(w).getTime();
      run = (prev !== null && t - prev === 7 * DAY) ? run + 1 : 1;
      if (run > best) best = run;
      prev = t;
    });
    return best;
  }
  function evaluateLeagueTitles(){
    var cur = weekKey(weekMonday(0));
    return db.from('league_entries').select('week,mode,no,best,at')
      .lt('week', cur).lt('best', NONE)
      .then(function(r){
        if (r.error) throw r.error;
        var groups = {};
        (r.data || []).forEach(function(x){
          var k = x.week + '|' + x.mode;
          (groups[k] = groups[k] || []).push(x);
        });
        var mine = [];
        Object.keys(groups).forEach(function(k){
          var g = groups[k].slice().sort(function(a, b){
            return (Number(a.best) - Number(b.best)) || (Number(a.at) - Number(b.at));
          });
          g.forEach(function(x, i){
            if (x.no === me.no) mine.push({ week: x.week, mode: x.mode, rank: i + 1 });
          });
        });
        var ids = [];
        function hasRank(n){ return mine.some(function(x){ return x.rank === n; }); }
        if (hasRank(1)) ids.push('champion');
        if (hasRank(2)) ids.push('silver');
        if (hasRank(3)) ids.push('bronze');
        if (mine.some(function(x){ return x.rank === 4 || x.rank === 5; })) ids.push('best5');
        if (mine.some(function(x){ return x.rank === 6 || x.rank === 7; })) ids.push('top7');

        var top3 = mine.filter(function(x){ return x.rank <= 3; }).length;
        var wins = mine.filter(function(x){ return x.rank === 1; }).length;
        if (top3 >= 10) ids.push('steady');
        if (wins >= 10) ids.push('mvp');

        var runTop3 = {}, runWin = {};
        ['react', 'stop'].forEach(function(m){
          runTop3[m] = longestRun(mine.filter(function(x){ return x.mode === m && x.rank <= 3; }).map(function(x){ return x.week; }).sort());
          runWin[m] = longestRun(mine.filter(function(x){ return x.mode === m && x.rank === 1; }).map(function(x){ return x.week; }).sort());
        });
        if (runTop3.react >= 3 || runTop3.stop >= 3) ids.push('elite');
        if (runWin.react >= 3 || runWin.stop >= 3) ids.push('medal3');
        if (runWin.react >= 3 && runWin.stop >= 3) ids.push('world');

        return grantIds(ids);
      });
  }

  /* ---------- titles ---------- */
  function loadTitles(){
    return db.from('user_titles').select('title').eq('no', me.no).then(function(r){
      if (r.error) throw r.error;

  function renderTitles(earnedIds){
    $('#title-now').textContent = '장착 칭호: ' + (me.equipped ? labelOf(me.equipped) : '없음');
    var list = $('#title-list');
    list.innerHTML = '';
    TITLES.forEach(function(t){
      var earned = earnedIds.indexOf(t.id) >= 0;
      var row = document.createElement('div');
      row.className = 'tt-row' + (earned ? '' : ' locked');
      var left = document.createElement('div');
      left.style.minWidth = '0';
      var lab = document.createElement('div');
      lab.style.fontWeight = '700';
      lab.textContent = t.label;
      var cond = document.createElement('div');
      cond.className = 'tt-cond';
      cond.textContent = t.cond;
      left.appendChild(lab); left.appendChild(cond);
      var right = document.createElement('div');
      if (earned){
        var b = document.createElement('button');
        var on = me.equipped === t.id;
        b.className = 'btn';
        b.dataset.id = t.id;
        b.textContent = on ? '장착 중' : '장착';
        b.disabled = on;
        right.appendChild(b);
      } else {
        right.className = 'tt-cond';
        right.textContent = '잠김';
      }
      row.appendChild(left); row.appendChild(right);
      list.appendChild(row);
    });
  }
  $('#title-list').addEventListener('click', function(e){
    var b = e.target.closest('button[data-id]');
    if (b) equipTitle(b.dataset.id);
  });
  $('#title-off').addEventListener('click', function(){ equipTitle(null); });
  function equipTitle(id){
    db.rpc('set_title', { p_no: me.no, p_id: id }).then(function(r){
      if (r.error) throw r.error;
      $('#title-msg').className = 'saved ok';
      $('#title-msg').textContent = id ? '칭호를 장착했어요.' : '칭호를 해제했어요.';
      return refreshAll();
    }).catch(function(){
      $('#title-msg').className = 'saved bad';
      $('#title-msg').textContent = '칭호를 바꾸지 못했어요.';
    });
  }

  function refreshAll(){
    if (!me) return Promise.resolve();
    return loadEquipped().then(function(){
      $('#me').textContent = (me.title ? me.title + ' ' : '') + me.no + '번 ' + honor(me);
      return evaluateLeagueTitles().catch(function(){});
    }).then(loadTitles)
      .then(loadBoard)
      .catch(function(){});
  }

  /* ---------- init ---------- */
  setMode('react');
  var saved = getSavedNo();
  if (saved !== null && !isNaN(saved) && Object.prototype.hasOwnProperty.call(ROSTER, saved)){
    me = { no: saved, name: ROSTER[saved] };
    loadEquipped().then(showMain).catch(function(){ showEntry(); });
  } else {
    showEntry();
  }
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
